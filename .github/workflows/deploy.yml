name: CI/CD Pipeline for SSL Bot

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PROJECT_PATH: /home/ioxnsun/SSL-BOT-for-telegram
  PYTHON_VERSION: '3.10'

jobs:
  test:
    name: Test SSL Bot
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov flake8 black
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=.

    - name: Notify Telegram about test results
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          🧪 *Test Results for SSL Bot*
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          
          Status: ${{ job.status }}
        format: markdown

  deploy:
    name: Deploy to Raspberry Pi
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Debug - Test SSH connection
      run: |
        echo "🔍 Проверка SSH подключения..."
        sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          echo '✅ SSH connection successful'
          echo '📌 Hostname: ' \$(hostname)
          echo '📌 Date: ' \$(date)
          echo '📌 Current user: ' \$(whoami)
        "

    - name: Create directory on server
      run: |
        echo "📁 Создание директории проекта..."
        sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          mkdir -p ${{ env.PROJECT_PATH }}
          echo '✅ Директория создана или уже существует'
        "

    - name: Copy files via rsync
      run: |
        echo "📋 Копирование файлов на сервер..."
        sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz --delete -e 'ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no' \
          --exclude '.git' \
          --exclude '.github' \
          --exclude '__pycache__' \
          --exclude '*.pyc' \
          --exclude 'tests' \
          --exclude '.pytest_cache' \
          --exclude '.coverage' \
          ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.PROJECT_PATH }}/
        echo "✅ Файлы скопированы"

    - name: Debug - Check and fix Python environment
      run: |
        echo "🐍 Проверка Python окружения на сервере:"
        sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          echo 'Python version:'
          python3 --version
          echo 'Pip version:'
          pip3 --version
          echo 'Venv status:'
          if [ -d '${{ env.PROJECT_PATH }}/venv' ]; then
            echo '✅ venv существует'
            if [ -d '${{ env.PROJECT_PATH }}/venv/bin' ]; then
              echo '✅ venv/bin существует'
              ls -la ${{ env.PROJECT_PATH }}/venv/bin/
            else
              echo '❌ venv/bin НЕ существует - venv повреждено!'
              echo 'Удаляем поврежденное venv...'
              rm -rf ${{ env.PROJECT_PATH }}/venv
              echo 'Создаем новое venv...'
              python3 -m venv ${{ env.PROJECT_PATH }}/venv
              echo '✅ Новое venv создано'
              ls -la ${{ env.PROJECT_PATH }}/venv/bin/
            fi
          else
            echo '❌ venv не существует'
            echo 'Создаем venv...'
            python3 -m venv ${{ env.PROJECT_PATH }}/venv
            echo '✅ venv создано'
          fi
        "

    - name: Stop old bot process (only from our project folder)
      run: |
        echo "🛑 Останавливаем старые процессы бота из папки ${{ env.PROJECT_PATH }}..."
        sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          echo 'Поиск процессов бота в нашей папке...'
          # Находим PID'ы процессов из нашей папки
          PIDS=\$(ps aux | grep '${{ env.PROJECT_PATH }}/venv/bin/python.*ssl_bot.py' | grep -v grep | awk '{print \$2}')
          
          if [ -n \"\$PIDS\" ]; then
            echo \"Найдены процессы: \$PIDS\"
            echo 'Останавливаем процессы...'
            # Убиваем каждый процесс по PID
            for PID in \$PIDS; do
              echo \"Убиваем процесс \$PID\"
              kill -9 \$PID 2>/dev/null || true
            done
            sleep 2
            echo 'Проверка:'
            ps aux | grep '${{ env.PROJECT_PATH }}/venv/bin/python.*ssl_bot.py' | grep -v grep || echo '✅ Процессы остановлены'
          else
            echo '✅ Процессы не найдены (это нормально)'
          fi
        "
        echo "✅ Шаг остановки завершен успешно"

    - name: Deploy and restart bot
      run: |
        echo "🚀 Начинаем деплой и запуск бота..."
        sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          set -x  # Включаем отладку - каждая команда будет выводиться
          
          cd ${{ env.PROJECT_PATH }}
          
          echo '📦 Шаг 1: Проверка виртуального окружения...'
          if [ ! -d 'venv/bin' ]; then
            echo '❌ venv/bin не найден! Создаем заново...'
            rm -rf venv
            python3 -m venv venv
          else
            echo '✅ venv в порядке'
          fi
          
          echo '📚 Шаг 2: Установка зависимостей...'
          echo 'Upgrade pip:'
          venv/bin/pip install --upgrade pip
          echo 'Pip version:'
          venv/bin/pip --version
          echo 'Install requirements:'
          venv/bin/pip install -r requirements.txt
          if [ $? -ne 0 ]; then
            echo '❌ Ошибка установки зависимостей!'
            exit 1
          fi
          
          echo '🔑 Шаг 3: Обновление токена бота...'
          if [ -f ssl_bot.py ]; then
            sed -i 's/{{token}}/${{ secrets.BOT_TOKEN }}/g' ssl_bot.py
            echo '✅ Токен обновлен'
          else
            echo '❌ Файл ssl_bot.py не найден!'
            ls -la
            exit 1
          fi
          
          echo '🚀 Шаг 4: Запуск нового процесса бота...'
          cd ${{ env.PROJECT_PATH }}
          nohup venv/bin/python ssl_bot.py > bot_output.log 2>&1 &
          BOT_PID=$!
          echo "Бот запущен с PID: $BOT_PID"
          
          echo '⏳ Шаг 5: Ожидание запуска...'
          sleep 5
          
          echo '🔍 Шаг 6: Проверка запуска...'
          if pgrep -f '${{ env.PROJECT_PATH }}/venv/bin/python.*ssl_bot.py' > /dev/null; then
            echo '✅ Бот успешно запущен'
            echo '📄 Информация о процессе:'
            ps aux | grep '${{ env.PROJECT_PATH }}/venv/bin/python.*ssl_bot.py' | grep -v grep
          else
            echo '❌ Бот не запустился'
            echo '📄 Последние 20 строк лога:'
            if [ -f bot_output.log ]; then
              tail -20 bot_output.log
            else
              echo 'Файл лога не создан'
            fi
            exit 1
          fi
          
          echo '🎉 Деплой завершен успешно'
        "

    - name: Health Check - Verify bot is working
      run: |
        echo "🏥 Проверка работоспособности бота..."
        sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          # Даем боту время на инициализацию
          sleep 5
          
          echo '🔍 Шаг 1: Проверка процесса...'
          BOT_PID=\$(pgrep -f '${{ env.PROJECT_PATH }}/venv/bin/python.*ssl_bot.py')
          if [ -z \"\$BOT_PID\" ]; then
            echo '❌ КРИТИЧНО: Процесс бота не найден!'
            exit 1
          else
            echo \"✅ Процесс бота работает (PID: \$BOT_PID)\"
          fi
          
          echo '📄 Шаг 2: Проверка логов...'
          if [ -f ${{ env.PROJECT_PATH }}/bot_output.log ]; then
            echo 'Последние 20 строк лога:'
            tail -20 ${{ env.PROJECT_PATH }}/bot_output.log
            
            # Проверяем на критические ошибки
            if tail -50 ${{ env.PROJECT_PATH }}/bot_output.log | grep -E 'ERROR|CRITICAL|Traceback' > /dev/null; then
              echo '❌ Найдены ошибки в логах!'
              exit 1
            else
              echo '✅ Критических ошибок в логах нет'
            fi
          else
            echo '⚠️ Файл лога не найден'
          fi
          
          echo '📊 Шаг 3: Использование ресурсов...'
          ps -p \$BOT_PID -o %cpu,%mem,etime || echo 'Не удалось получить информацию'
          
          echo '🎉 Health check успешно пройден!'
        "

    - name: Final debug - Check running processes
      run: |
        echo "📊 Финальная проверка процессов на сервере:"
        sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          echo 'Все Python процессы:'
          ps aux | grep python
          echo ''
          echo 'Специфичные процессы нашего бота:'
          pgrep -f '${{ env.PROJECT_PATH }}/venv/bin/python.*ssl_bot.py' -a || echo 'Наш бот не запущен'
          echo ''
          echo 'Другие боты (должны работать):'
          ps aux | grep '/home/ioxnsun/bot/' | grep -v grep || echo 'Другие боты не найдены'
          echo ''
          echo 'Последние строки лога нашего бота:'
          tail -20 ${{ env.PROJECT_PATH }}/bot_output.log 2>/dev/null || echo 'Лог файл не найден'
        "

    - name: Notify Telegram about deployment
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ${{ job.status == 'success' && '✅' || '❌' }} *Deployment to Raspberry Pi*
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          Status: *${{ job.status }}*
          Server: `${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }}`
          Path: `${{ env.PROJECT_PATH }}`
        format: markdown