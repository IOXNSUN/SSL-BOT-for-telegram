name: CI/CD Pipeline for SSL Bot

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PROJECT_PATH: /home/ioxnsun/SSL-BOT-for-telegram
  PYTHON_VERSION: '3.10'

jobs:
  test:
    name: Test SSL Bot
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov flake8 black
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=.

    - name: Notify Telegram about test results
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          🧪 *Test Results for SSL Bot*
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          
          Status: ${{ job.status }}
        format: markdown

  deploy:
    name: Deploy to Raspberry Pi
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Create directory on server
      run: |
        sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ env.PROJECT_PATH }}"

    - name: Copy files via rsync
      run: |
        sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz --delete -e 'ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no' \
          --exclude '.git' \
          --exclude '.github' \
          --exclude '__pycache__' \
          --exclude '*.pyc' \
          --exclude 'tests' \
          --exclude '.pytest_cache' \
          --exclude '.coverage' \
          ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.PROJECT_PATH }}/

    - name: Deploy and restart bot
      run: |
        sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          cd ${{ env.PROJECT_PATH }}
          
          echo '📦 Проверяем виртуальное окружение...'
          if [ ! -f 'venv/bin/activate' ]; then
            echo '❌ venv не найден! Создаем...'
            python3 -m venv venv
          else
            echo '✅ venv существует'
          fi
          
          echo '📚 Устанавливаем/обновляем зависимости...'
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          
          echo '🔑 Обновляем токен бота...'
          sed -i 's/{{token}}/${{ secrets.BOT_TOKEN }}/g' ssl_bot.py
          
          echo '🔄 Перезапускаем бота...'
          pkill -f 'python.*ssl_bot.py' || true
          sleep 2
          
          echo '🚀 Запускаем бота...'
          cd ${{ env.PROJECT_PATH }}
          nohup venv/bin/python ssl_bot.py > bot_output.log 2>&1 &
          
          echo '⏳ Ждем запуск...'
          sleep 5
          
          if pgrep -f 'python.*ssl_bot.py' > /dev/null; then
            echo '✅ Бот успешно запущен'
            echo '📄 Информация о процессе:'
            ps aux | grep python.*ssl_bot.py | grep -v grep
          else
            echo '❌ Бот не запустился'
            echo '📄 Последние 20 строк лога:'
            tail -20 bot_output.log
            exit 1
          fi
          
          echo '🎉 Деплой завершен успешно'
        "

    - name: Notify Telegram about deployment
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ${{ job.status == 'success' && '✅' || '❌' }} *Deployment to Raspberry Pi*
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          
          Status: *${{ job.status }}*
          Server: `${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }}`
          Path: `${{ env.PROJECT_PATH }}`
        format: markdown